<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="440"
  viewBox="0 0 960 440"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">PageNest Companion 阅读与互动</title>
  <desc id="description">
    后台逐篇启用，读者在权限检查后使用段落评论、章节导航和点赞。私人记录保持作者可见，展示由主题负责。
  </desc>
  <rect width="960" height="440" rx="24" fill="#f5f7f3" />
  <g font-family="sans-serif" fill="#25382f">
    <text x="40" y="54" font-size="28">PageNest Companion</text>
    <text x="40" y="88" font-size="17">后台明确启用 · 服务端校验权限 · 保留既有记录</text>
    <rect x="40" y="122" width="270" height="184" rx="16" fill="#e3eee5" />
    <rect x="345" y="122" width="270" height="184" rx="16" fill="#e3eee5" />
    <rect x="650" y="122" width="270" height="184" rx="16" fill="#e3eee5" />
    <g font-size="23">
      <text x="66" y="162">段落评论</text>
      <text x="371" y="162">章节导航</text>
      <text x="676" y="162">文章点赞</text>
    </g>
    <g font-size="17">
      <text x="66" y="201">登录后明确公开发布</text>
      <text x="66" y="235">本人编辑 · 冲突保护</text>
      <text x="66" y="269">私人记录仅作者可见</text>
      <text x="371" y="201">同名系列与章节顺序</text>
      <text x="371" y="235">目标文章阅读权限</text>
      <text x="371" y="269">只转换渲染链接</text>
      <text x="676" y="201">公开可读 · 本人禁止</text>
      <text x="676" y="235">历史与并发请求去重</text>
      <text x="676" y="269">可选经验事件订阅</text>
    </g>
    <text x="40" y="355" font-size="19">普通评论邮件通知 · 编辑器兼容 · 公式与高亮适配</text>
    <text x="40" y="391" font-size="17">主题负责外观和动作位置；其他主题使用独立评论抽屉。</text>
  </g>
</svg>
