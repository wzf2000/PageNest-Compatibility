<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">PageNest Compatibility 功能示意</title>
  <desc id="desc">三个功能分支：评论通知通过 WordPress 邮件服务发送；Markdown 保留公式并支持文章编辑器选择；支持对应特性的主题启用 MathJax 远端加载和 Prism 路径适配。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7f5"/>
      <stop offset="1" stop-color="#e9eff6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="610" rx="24" fill="url(#background)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
    <text x="64" y="64" fill="#56746b" font-size="14" letter-spacing="3">PAGENEST · COMPATIBILITY</text>
    <text x="64" y="112" fill="#1f3d35" font-size="32" font-weight="650">衔接内容、阅读与讨论</text>
    <text x="64" y="149" fill="#62736e" font-size="17">独立插件，让站点功能与主题外观各自独立</text>
    <g fill="#ffffff" stroke="#d7e3de">
      <rect x="64" y="196" width="344" height="318" rx="18"/>
      <rect x="428" y="196" width="344" height="318" rx="18"/>
      <rect x="792" y="196" width="344" height="318" rx="18"/>
    </g>
    <g fill="#eaf2ee">
      <rect x="88" y="220" width="48" height="48" rx="12"/>
      <rect x="452" y="220" width="48" height="48" rx="12"/>
      <rect x="816" y="220" width="48" height="48" rx="12"/>
    </g>
    <g stroke="#486d5e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="99" y="235" width="26" height="18" rx="3"/>
      <path d="m100 237 12 9 12-9"/>
      <path d="M465 232h18l5 5v19h-23z M483 232v6h5 M470 244h12 M470 249h8"/>
      <path d="m830 236-6 8 6 8 m20-16 6 8-6 8 m-8-20-4 24"/>
    </g>
    <g fill="#1f3d35" font-size="23" font-weight="650">
      <text x="88" y="307">评论通知</text>
      <text x="452" y="307">Markdown 兼容</text>
      <text x="816" y="307">公式与高亮</text>
    </g>
    <g fill="#62736e" font-size="17">
      <text x="88" y="342">审核通过的新留言与回复</text>
      <text x="452" y="342">保留旧公式保护规则</text>
      <text x="816" y="342">支持对应特性的主题启用</text>
    </g>
    <g stroke="#cfddd6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M112 367v34m-5-5 5 5 5-5"/>
      <path d="M476 367v34m-5-5 5 5 5-5"/>
      <path d="M840 367v34m-5-5 5 5 5-5"/>
    </g>
    <g fill="#334d44" font-size="18">
      <text x="88" y="435">WordPress 邮件服务</text>
      <text x="452" y="435">每篇文章的编辑器选择</text>
      <text x="816" y="435">MathJax · Prism 适配</text>
    </g>
    <g fill="#62736e" font-size="15">
      <text x="88" y="474">权限检查 · 通知去重</text>
      <text x="452" y="474">沿用现有编辑器提供方</text>
      <text x="816" y="474">远端公式资源 · 组件路径</text>
    </g>
    <text x="64" y="563" fill="#62736e" font-size="15">功能示意 · 不包含 SMTP 配置、编辑器本体或站点数据迁移</text>
  </g>
</svg>
