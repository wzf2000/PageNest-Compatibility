<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">PageNest 与 Companion 的职责</title>
  <desc id="desc">主题负责外观与阅读布局；Companion 负责互动、功能配置与服务端权限；具体工具与经验政策属于独立可选实现。示意图，不是产品界面。</desc>
  <rect width="1120" height="340" rx="12" fill="#f6f5f0"/>
  <g font-family="system-ui, -apple-system, 'Noto Sans CJK SC', sans-serif">
    <text x="36" y="44" fill="#60776a" font-size="13" letter-spacing="2">ONE SITE · CLEAR RESPONSIBILITIES</text>
    <text x="36" y="84" fill="#273d35" font-size="25" font-weight="600">外观与功能分开维护，按需组合。</text>
    <rect x="36" y="112" width="318" height="162" rx="8" fill="#fffefa" stroke="#d6ddd3"/>
    <rect x="402" y="112" width="318" height="162" rx="8" fill="#e6ece2" stroke="#bdcdbc"/>
    <rect x="768" y="112" width="316" height="162" rx="8" fill="#fffefa" stroke="#d6ddd3"/>
    <g fill="#273d35" font-size="23" font-weight="600">
      <text x="58" y="152">PageNest</text>
      <text x="424" y="152">Companion</text>
      <text x="790" y="152">独立可选实现</text>
    </g>
    <g fill="#566b5d" font-size="17">
      <text x="58" y="190">首页 · 模板 · 目录</text>
      <text x="58" y="220">视觉 · 阅读偏好 · 布局</text>
      <text x="424" y="190">互动 · 导览 · 搜索与媒体</text>
      <text x="424" y="220">功能配置 · 数据与权限</text>
      <text x="790" y="190">经验政策 · 具体工具</text>
      <text x="790" y="220">游戏 · 其他业务服务</text>
    </g>
    <g stroke="#809783" stroke-width="2" fill="none">
      <path d="M365 191h26m-6-6 6 6-6 6"/>
      <path d="M731 191h26m-6-6 6 6-6 6"/>
    </g>
    <text x="36" y="309" fill="#6d7a6d" font-size="15">职责示意 · 主题可独立使用 · 可选模块须明确启用 · 不自动导入或迁移文章</text>
  </g>
</svg>
